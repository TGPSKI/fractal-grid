name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of fractal-grid are you using?
  - type: input
    id: environment
    attributes:
      label: Environment
      description: KDE Plasma and KWin version (e.g. Plasma 6.3.2), plus Wayland or X11
      placeholder: Plasma 6.3.2 / Wayland