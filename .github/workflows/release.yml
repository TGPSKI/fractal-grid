name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for (e.g. v0.1.0)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v6.0.2 (Node.js 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Package
        run: make build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            git fetch --tags --force
            git checkout "$TAG"
            make build
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          NOTES=$(awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \\[/  { exit }
            capture                   { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            gh release create "$TAG" "$PWD/fractal-grid.kwinscript" --generate-notes
          else
            printf '%s\n' "$NOTES" | gh release create "$TAG" "$PWD/fractal-grid.kwinscript" \
              --title "fractal-grid $TAG" --notes-file -
          fi